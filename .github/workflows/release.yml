name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install development tools
      run: make tools

    - name: Run tests
      run: make test

    - name: Run security checks
      run: make security

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body: |
          ## Lethe ${{ github.ref_name }}

          High-performance, audit-grade log rotation library for Go.

          ### Installation
          ```bash
          go get github.com/agilira/lethe@${{ github.ref_name }}
          ```

          ### Changes
          See [changelog/${{ github.ref_name }}.txt](https://github.com/agilira/lethe/blob/main/changelog/${{ github.ref_name }}.txt) for details.
        generate_release_notes: true
        draft: false
        prerelease: false